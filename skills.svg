<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- Card Border & Background -->
  <rect width="600" height="180" rx="16" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Title -->
  <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f0f6fc">⚡ Core Capabilities Dashboard</text>

  <!-- 1. Frontend Development -->
  <text x="30" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#8b949e">Frontend Web</text>
  <text x="520" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="end">95%</text>
  <rect x="150" y="56" width="370" height="8" rx="4" fill="#30363d" />
  <rect x="150" y="56" width="0" height="8" rx="4" fill="url(#blue-cyan)">
    <animate attributeName="width" from="0" to="351" dur="1.5s" fill="freeze" keyTimes="0;1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
  </rect>

  <!-- 2. Backend & Architectures -->
  <text x="30" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#8b949e">Backend &amp; DB</text>
  <text x="520" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="end">90%</text>
  <rect x="150" y="86" width="370" height="8" rx="4" fill="#30363d" />
  <rect x="150" y="86" width="0" height="8" rx="4" fill="url(#blue-cyan)">
    <animate attributeName="width" from="0" to="333" dur="1.5s" fill="freeze" keyTimes="0;1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
  </rect>

  <!-- 3. UI/UX Design -->
  <text x="30" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#8b949e">UI/UX Design</text>
  <text x="520" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="end">85%</text>
  <rect x="150" y="116" width="370" height="8" rx="4" fill="#30363d" />
  <rect x="150" y="116" width="0" height="8" rx="4" fill="url(#blue-cyan)">
    <animate attributeName="width" from="0" to="314.5" dur="1.5s" fill="freeze" keyTimes="0;1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
  </rect>

  <!-- 4. AI & Workflow Automation -->
  <text x="30" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#8b949e">AI Automation</text>
  <text x="520" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="end">80%</text>
  <rect x="150" y="146" width="370" height="8" rx="4" fill="#30363d" />
  <rect x="150" y="146" width="0" height="8" rx="4" fill="url(#blue-cyan)">
    <animate attributeName="width" from="0" to="296" dur="1.5s" fill="freeze" keyTimes="0;1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
  </rect>
</svg>
