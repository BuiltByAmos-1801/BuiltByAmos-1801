<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <style>
    /* Star Twinkling Animation */
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1.0; }
    }
    .s1 { animation: twinkle 2s infinite ease-in-out; }
    .s2 { animation: twinkle 3.5s infinite ease-in-out; }
    .s3 { animation: twinkle 1.5s infinite ease-in-out; }
    .s4 { animation: twinkle 2.8s infinite ease-in-out; }

    /* Neon Title Pulsing Glow & Flickering */
    @keyframes neon-pulse {
      0%, 100% {
        text-shadow: 0 0 2px #ff007f, 0 0 6px #ff007f, 0 0 10px #ff007f;
      }
      50% {
        text-shadow: 0 0 4px #ff007f, 0 0 12px #ff007f, 0 0 22px #ff007f;
      }
    }
    @keyframes neon-flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.85; }
    }
    .neon-title {
      animation: neon-pulse 3s infinite alternate, neon-flicker 10s infinite;
    }

    /* Subtitle Neon Glow */
    @keyframes cyan-pulse {
      0%, 100% {
        text-shadow: 0 0 1px #00f0ff, 0 0 4px #00f0ff;
      }
      50% {
        text-shadow: 0 0 3px #00f0ff, 0 0 8px #00f0ff;
      }
    }
    .neon-sub {
      animation: cyan-pulse 2.5s infinite alternate;
    }
  </style>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07020d" />
      <stop offset="60%" stop-color="#0f091f" />
      <stop offset="100%" stop-color="#1b0c36" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="40%" stop-color="#ff5500" />
      <stop offset="85%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ffee00" />
    </linearGradient>

    <!-- Grid Fade Mask -->
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Right Image Blend Fade Mask -->
    <linearGradient id="fade-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <mask id="image-mask">
      <rect x="440" y="0" width="360" height="260" fill="url(#fade-grad)" />
    </mask>

    <!-- Shooting Star Gradient -->
    <linearGradient id="star-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="1" />
    </linearGradient>

    <!-- Sun Clip Path for Scrolling Slices -->
    <clipPath id="sun-clip">
      <circle cx="260" cy="130" r="60" />
    </clipPath>

    <!-- Grid Clip Path for Looping Perspective lines -->
    <clipPath id="grid-clip">
      <rect x="0" y="180" width="800" height="80" />
    </clipPath>

    <!-- Neon Glow Filters -->
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-sun" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" fill="url(#bg-grad)" />

  <!-- Stars with Twinkle Animation Classes -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="50" cy="30" r="1" class="s1" />
    <circle cx="120" cy="70" r="1.5" class="s2" />
    <circle cx="210" cy="40" r="1" class="s3" />
    <circle cx="340" cy="65" r="1" class="s4" />
    <circle cx="430" cy="45" r="1.5" class="s1" />
    <circle cx="90" cy="120" r="0.8" class="s3" />
  </g>

  <!-- Shooting Star (Diagonal zip) -->
  <path d="M-40,20 L40,-10" stroke="url(#star-grad)" stroke-width="2" filter="url(#glow-cyan)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="750,150" dur="5s" repeatCount="indefinite" begin="1s" />
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.2;0.3;0.4;1" dur="5s" repeatCount="indefinite" begin="1s" />
  </path>

  <!-- Glowing Sun with Looping Scroll Slices -->
  <g>
    <g clip-path="url(#sun-clip)">
      <circle cx="260" cy="130" r="60" fill="url(#sun-grad)" filter="url(#glow-sun)" opacity="0.9">
        <animate attributeName="r" values="59;61;59" dur="4s" repeatCount="indefinite" />
      </circle>
      <!-- Sun Crop lines scrolling downwards -->
      <g fill="#0f091f">
        <rect x="190" y="80" width="140" height="2.5" />
        <rect x="190" y="93" width="140" height="3" />
        <rect x="190" y="107" width="140" height="4" />
        <rect x="190" y="122" width="140" height="5" />
        <rect x="190" y="138" width="140" height="6.5" />
        <rect x="190" y="155" width="140" height="8" />
        <rect x="190" y="173" width="140" height="9.5" />
        <rect x="190" y="192" width="140" height="11.5" />
        <rect x="190" y="212" width="140" height="14" />
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 15" dur="2.5s" repeatCount="indefinite" />
      </g>
    </g>
  </g>

  <!-- Wireframe Mountains (Horizon line is y=180, on the left side) -->
  <g stroke-width="1.5" fill-opacity="0.15" opacity="0.6">
    <polygon points="10,180 90,100 170,180" stroke="#9d00ff" fill="#9d00ff" />
    <polygon points="110,180 210,80 310,180" stroke="#ff007f" fill="#ff007f" filter="url(#glow-pink)" />
    <polygon points="260,180 360,95 460,180" stroke="#9d00ff" fill="#9d00ff" />
  </g>

  <!-- Fully Animated 3D Grid (Horizon at y=180, bottom at y=260) -->
  <g mask="url(#grid-fade)" opacity="0.8">
    <!-- Horizon baseline -->
    <line x1="0" y1="180" x2="800" y2="180" stroke="#ff007f" stroke-width="2" />
    
    <!-- Perspective vertical lines (radiate outwards, static) -->
    <line x1="260" y1="180" x2="-200" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="260" y1="180" x2="0" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="260" y1="180" x2="150" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="260" y1="180" x2="280" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="260" y1="180" x2="380" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="260" y1="180" x2="500" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="260" y1="180" x2="650" y2="260" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="260" y1="180" x2="800" y2="260" stroke="#00f0ff" stroke-width="1.5" />

    <!-- Animating perspective horizontal lines zipping downwards -->
    <g clip-path="url(#grid-clip)">
      <g>
        <line x1="0" y1="180" x2="800" y2="180" stroke="#ff007f" stroke-width="1" />
        <line x1="0" y1="185" x2="800" y2="185" stroke="#ff007f" stroke-width="1" />
        <line x1="0" y1="192" x2="800" y2="192" stroke="#ff007f" stroke-width="1.2" />
        <line x1="0" y1="202" x2="800" y2="202" stroke="#ff007f" stroke-width="1.2" />
        <line x1="0" y1="215" x2="800" y2="215" stroke="#ff007f" stroke-width="1.5" />
        <line x1="0" y1="232" x2="800" y2="232" stroke="#ff007f" stroke-width="1.5" />
        <line x1="0" y1="255" x2="800" y2="255" stroke="#ff007f" stroke-width="2" />
        <line x1="0" y1="285" x2="800" y2="285" stroke="#ff007f" stroke-width="2.5" />
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 15" dur="1s" repeatCount="indefinite" />
      </g>
    </g>
  </g>

  <!-- Masked/Blended User Photo on the Right Side -->
  <image href="./images/MainAuthorAmos.png" x="440" y="0" width="360" height="260" preserveAspectRatio="xMidYMid slice" mask="url(#image-mask)" />

  <!-- Text Content (Left aligned & Centered on the left half x=230) -->
  <!-- MAIN TITLE (BUILT BY AMOS) -->
  <text x="240" y="85" 
        class="neon-title"
        font-family="'Montserrat', 'Century Gothic', 'Futura', sans-serif" 
        font-weight="900" 
        font-size="38" 
        fill="#ffffff" 
        stroke="#ff007f" 
        stroke-width="1.5"
        letter-spacing="6" 
        text-anchor="middle" 
        filter="url(#glow-pink)">BUILT BY AMOS</text>

  <!-- SUBTITLE (PREMIUM SOFTWARE AGENCY) -->
  <text x="240" y="115" 
        class="neon-sub"
        font-family="'Courier New', Courier, monospace" 
        font-weight="bold" 
        font-size="12.5" 
        fill="#00f0ff" 
        letter-spacing="3" 
        text-anchor="middle" 
        filter="url(#glow-cyan)">PREMIUM SOFTWARE &amp; WEB ENGINEERING</text>

  <!-- TOPIC BADGES / SUBTOPICS -->
  <text x="240" y="222" 
        font-family="'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-weight="600" 
        font-size="11" 
        fill="#ffffff" 
        letter-spacing="2" 
        text-anchor="middle" 
        opacity="0.9">CUSTOM SAAS • AI AUTOMATIONS • WEB &amp; MOBILE APPS</text>
</svg>
