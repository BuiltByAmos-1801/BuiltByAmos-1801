<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07020d" />
      <stop offset="60%" stop-color="#0f091f" />
      <stop offset="100%" stop-color="#1b0c36" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="40%" stop-color="#ff5500" />
      <stop offset="85%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ffee00" />
    </linearGradient>

    <!-- Grid Fade Mask -->
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-sun" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" fill="url(#bg-grad)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="70" cy="40" r="1" opacity="0.5"/>
    <circle cx="150" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="230" cy="30" r="1"/>
    <circle cx="310" cy="65" r="1" opacity="0.4"/>
    <circle cx="480" cy="45" r="1.5" opacity="0.9"/>
    <circle cx="560" cy="75" r="1"/>
    <circle cx="640" cy="35" r="1.2" opacity="0.6"/>
    <circle cx="720" cy="85" r="1"/>
    <circle cx="750" cy="50" r="1.5"/>
    <circle cx="100" cy="110" r="0.8" opacity="0.5"/>
    <circle cx="680" cy="115" r="1" opacity="0.4"/>
  </g>

  <!-- Glowing Sun -->
  <g>
    <circle cx="400" cy="130" r="60" fill="url(#sun-grad)" filter="url(#glow-sun)" opacity="0.95" />
    <!-- Sun Horizon Crop Lines (Vaporwave style) -->
    <rect x="335" y="132" width="130" height="3" fill="#0f091f" />
    <rect x="335" y="141" width="130" height="4" fill="#0f091f" />
    <rect x="335" y="151" width="130" height="5" fill="#0f091f" />
    <rect x="335" y="163" width="130" height="7" fill="#0f091f" />
    <rect x="335" y="177" width="130" height="9" fill="#0f091f" />
  </g>

  <!-- Wireframe Mountains (Horizon line is y=180) -->
  <g stroke-width="1.5" fill-opacity="0.15" opacity="0.7">
    <!-- Mountain Far Left -->
    <polygon points="50,180 130,100 210,180" stroke="#9d00ff" fill="#9d00ff" />
    <!-- Mountain Far Right -->
    <polygon points="590,180 670,95 750,180" stroke="#9d00ff" fill="#9d00ff" />
    <!-- Mountain Left-Center -->
    <polygon points="150,180 250,80 350,180" stroke="#ff007f" fill="#ff007f" filter="url(#glow-pink)" />
    <!-- Mountain Right-Center -->
    <polygon points="450,180 550,75 650,180" stroke="#ff007f" fill="#ff007f" filter="url(#glow-pink)" />
  </g>

  <!-- Grid (Horizon at y=180, bottom at y=260) -->
  <g mask="url(#grid-fade)" opacity="0.8">
    <!-- Horizon baseline -->
    <line x1="0" y1="180" x2="800" y2="180" stroke="#ff007f" stroke-width="2" />
    
    <!-- Perspective vertical lines -->
    <line x1="400" y1="180" x2="-200" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="0" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="150" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="280" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="360" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="400" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="440" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="520" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="650" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="800" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />
    <line x1="400" y1="180" x2="1000" y2="260" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />

    <!-- Perspective horizontal lines -->
    <line x1="0" y1="185" x2="800" y2="185" stroke="#ff007f" stroke-width="1" />
    <line x1="0" y1="192" x2="800" y2="192" stroke="#ff007f" stroke-width="1" />
    <line x1="0" y1="202" x2="800" y2="202" stroke="#ff007f" stroke-width="1.2" />
    <line x1="0" y1="215" x2="800" y2="215" stroke="#ff007f" stroke-width="1.2" />
    <line x1="0" y1="232" x2="800" y2="232" stroke="#ff007f" stroke-width="1.5" />
    <line x1="0" y1="255" x2="800" y2="255" stroke="#ff007f" stroke-width="2" />
  </g>

  <!-- Text Content -->
  <!-- MAIN TITLE (BUILT BY AMOS) -->
  <text x="400" y="80" 
        font-family="'Montserrat', 'Century Gothic', 'Futura', sans-serif" 
        font-weight="900" 
        font-size="42" 
        fill="#ffffff" 
        stroke="#ff007f" 
        stroke-width="1.5"
        letter-spacing="8" 
        text-anchor="middle" 
        filter="url(#glow-pink)">BUILT BY AMOS</text>

  <!-- SUBTITLE (PREMIUM SOFTWARE AGENCY) -->
  <text x="400" y="112" 
        font-family="'Courier New', Courier, monospace" 
        font-weight="bold" 
        font-size="14" 
        fill="#00f0ff" 
        letter-spacing="5" 
        text-anchor="middle" 
        filter="url(#glow-cyan)">PREMIUM SOFTWARE &amp; WEB ENGINEERING</text>

  <!-- TOPIC BADGES / SUBTOPICS -->
  <text x="400" y="222" 
        font-family="'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-weight="600" 
        font-size="12" 
        fill="#ffffff" 
        letter-spacing="3" 
        text-anchor="middle" 
        opacity="0.9">CUSTOM SAAS • AI AUTOMATIONS • WEB &amp; MOBILE APPS</text>
</svg>
