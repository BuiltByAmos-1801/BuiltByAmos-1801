<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <style>
    @keyframes float-grid {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulse-node {
      0%, 100% { filter: drop-shadow(0 0 2px #58a6ff); opacity: 0.5; }
      50% { filter: drop-shadow(0 0 8px #00e5ff) drop-shadow(0 0 15px #7c3aed); opacity: 1; }
    }
    .grid-lines {
      animation: float-grid 8s infinite ease-in-out;
    }
    .node-pulse {
      animation: pulse-node 4s infinite alternate;
    }
  </style>

  <defs>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="#0d1117" />

  <!-- Grid Points and Connections -->
  <g class="grid-lines" stroke="#161b22" stroke-width="1" opacity="0.8">
    <!-- Horizontal & Vertical grids -->
    <line x1="0" y1="20" x2="800" y2="20" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="100" y1="0" x2="100" y2="120" />
    <line x1="300" y1="0" x2="300" y2="120" />
    <line x1="500" y1="0" x2="500" y2="120" />
    <line x1="700" y1="0" x2="700" y2="120" />

    <!-- Diagonal tech mesh lines -->
    <line x1="100" y1="20" x2="300" y2="60" stroke="url(#glow-grad)" stroke-dasharray="5 5" opacity="0.3" />
    <line x1="300" y1="60" x2="500" y2="20" stroke="url(#glow-grad)" stroke-dasharray="5 5" opacity="0.3" />
    <line x1="500" y1="100" x2="700" y2="60" stroke="url(#glow-grad)" stroke-dasharray="5 5" opacity="0.3" />
  </g>

  <!-- Pulse nodes -->
  <circle cx="100" cy="20" r="3" fill="#58a6ff" class="node-pulse" />
  <circle cx="300" cy="60" r="4.5" fill="#7c3aed" class="node-pulse" />
  <circle cx="500" cy="20" r="3" fill="#00e5ff" class="node-pulse" />
  <circle cx="700" cy="60" r="3.5" fill="#58a6ff" class="node-pulse" />
  <circle cx="500" cy="100" r="4" fill="#7c3aed" class="node-pulse" />
</svg>
