<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagon Frame -->
  <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="none" stroke="url(#logo-grad)" stroke-width="3" filter="url(#neon-glow)" />
  <polygon points="50,8 87,30 87,70 50,92 13,70 13,30" fill="none" stroke="#161b22" stroke-width="1.5" />

  <!-- Stylized BBA Text / Monogram -->
  <text x="50" y="58" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-weight="900" 
        font-size="28" 
        fill="#f0f6fc" 
        text-anchor="middle"
        letter-spacing="0.5">BBA</text>

  <!-- Underline Glow dot -->
  <circle cx="50" cy="68" r="2.5" fill="#00e5ff" filter="url(#neon-glow)" />
</svg>
