<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100%">
  <defs>
    <linearGradient id="luxury-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect width="800" height="100" fill="#0d1117" />
  
  <!-- Glowing vector curves -->
  <path d="M-100 80 C 150 10, 450 100, 900 20" fill="none" stroke="url(#line-grad)" stroke-width="2" opacity="0.6" />
  <path d="M-100 40 C 250 90, 500 10, 900 60" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4" />

  <!-- Grid overlay -->
  <rect width="800" height="100" fill="url(#luxury-glow)" />
</svg>
