<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 10" width="100%">
  <defs>
    <!-- Flowing linear gradient -->
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="25%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#9d00ff" />
      <stop offset="75%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff007f" />
      <animate attributeName="x1" from="0%" to="-100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="200%" to="100%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="800" height="8" rx="4" fill="url(#div-grad)" />
</svg>
