<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 30" width="100%" height="30">
  <style>
    .typing-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      fill: #00f0ff;
      font-weight: bold;
      letter-spacing: 2px;
      opacity: 0;
      filter: drop-shadow(0 0 4px #00f0ff);
    }
    @keyframes cycle-1 {
      0%, 30% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes cycle-2 {
      0%, 33% { opacity: 0; }
      36%, 66% { opacity: 1; }
      69%, 100% { opacity: 0; }
    }
    @keyframes cycle-3 {
      0%, 69% { opacity: 0; }
      72%, 96% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .t1 { animation: cycle-1 12s infinite; }
    .t2 { animation: cycle-2 12s infinite; }
    .t3 { animation: cycle-3 12s infinite; }
  </style>
  <text x="300" y="20" class="typing-text t1" text-anchor="middle">⚡ Premium Software &amp; Web Engineering Agency</text>
  <text x="300" y="20" class="typing-text t2" text-anchor="middle">🚀 Custom SaaS &amp; Business Intelligence Systems</text>
  <text x="300" y="20" class="typing-text t3" text-anchor="middle">🤖 AI Integrations &amp; Automation Workflows</text>
</svg>
